
name: Daily Coding Log

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-log:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create daily log entry
        run: |
          mkdir -p journal
          DATE=$(date -u +%Y-%m-%d)
          echo "# Daily Coding Log - $DATE" > "journal/$DATE.md"
          echo "" >> "journal/$DATE.md"
          echo "Record your actual coding progress, learning or project work here." >> "journal/$DATE.md"

      - name: Commit and push
        run: |
          git add journal/
          git diff --cached --quiet || git commit -m "Add daily coding journal entry"
          git push
